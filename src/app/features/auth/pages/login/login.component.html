<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-lg border border-gray-100">

    <div class="text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-brand-500 text-white font-bold text-xl mb-3 shadow-md">
        HD
      </div>
      <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Mesa de Ayuda</h2>
      <p class="mt-2 text-sm text-gray-500">Inicia sesión para gestionar tus tickets de soporte</p>
    </div>

    <div *ngIf="sessionExpired && !errorMessage()" class="p-4 rounded-xl bg-amber-50 border border-amber-200 text-amber-700 text-sm">
      Tu sesión expiró. Vuelve a iniciar sesión para continuar.
    </div>

    <div *ngIf="errorMessage()" class="p-4 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm flex items-center gap-2">
      <svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
      </svg>
      <span>{{ errorMessage() }}</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-8 space-y-6">
      <div class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Correo electrónico</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            formControlName="email"
            placeholder="correo@empresa.com"
            [ngClass]="{ 'border-red-500 focus:ring-red-500': isInvalid('email') }"
            class="mt-1 block w-full px-4 py-3 rounded-xl border border-gray-300 shadow-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm transition-colors outline-none"
          />
          <p *ngIf="isInvalid('email')" class="mt-1 text-xs text-red-500">Ingresa un correo electrónico válido.</p>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            formControlName="password"
            placeholder="••••••••"
            [ngClass]="{ 'border-red-500 focus:ring-red-500': isInvalid('password') }"
            class="mt-1 block w-full px-4 py-3 rounded-xl border border-gray-300 shadow-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm transition-colors outline-none"
          />
          <p *ngIf="isInvalid('password')" class="mt-1 text-xs text-red-500">La contraseña debe tener al menos 6 caracteres.</p>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full flex justify-center py-3 px-4 rounded-xl shadow-md text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all"
      >
        <span *ngIf="!isLoading()">Iniciar sesión</span>
        <span *ngIf="isLoading()" class="flex items-center gap-2">
          <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Entrando...
        </span>
      </button>

      <p class="text-center text-sm text-gray-600">
        ¿No tienes cuenta?
        <a routerLink="/auth/register" class="font-medium text-brand-600 hover:text-brand-500">Regístrate aquí</a>
      </p>
    </form>
  </div>
</div>
