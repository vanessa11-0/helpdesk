<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-lg border border-gray-100">

    <div class="text-center">
      <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Crear cuenta</h2>
      <p class="mt-2 text-sm text-gray-500">Las cuentas nuevas se registran como cliente</p>
    </div>

    <div *ngIf="errorMessage()" class="p-4 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm">
      {{ errorMessage() }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-8 space-y-6">
      <div class="space-y-4">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700">Nombre completo</label>
          <input
            id="name"
            type="text"
            autocomplete="name"
            formControlName="name"
            placeholder="Juan Pérez"
            [ngClass]="{ 'border-red-500 focus:ring-red-500': isInvalid('name') }"
            class="mt-1 block w-full px-4 py-3 rounded-xl border border-gray-300 shadow-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm transition-colors outline-none"
          />
          <p *ngIf="isInvalid('name')" class="mt-1 text-xs text-red-500">El nombre debe tener al menos 3 caracteres.</p>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Correo electrónico</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            formControlName="email"
            placeholder="correo@empresa.com"
            [ngClass]="{ 'border-red-500 focus:ring-red-500': isInvalid('email') }"
            class="mt-1 block w-full px-4 py-3 rounded-xl border border-gray-300 shadow-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm transition-colors outline-none"
          />
          <p *ngIf="isInvalid('email')" class="mt-1 text-xs text-red-500">Ingresa un correo electrónico válido.</p>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
          <input
            id="password"
            type="password"
            autocomplete="new-password"
            formControlName="password"
            placeholder="••••••••"
            [ngClass]="{ 'border-red-500 focus:ring-red-500': isInvalid('password') }"
            class="mt-1 block w-full px-4 py-3 rounded-xl border border-gray-300 shadow-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm transition-colors outline-none"
          />
          <p *ngIf="isInvalid('password')" class="mt-1 text-xs text-red-500">La contraseña requiere al menos 6 caracteres.</p>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full flex justify-center py-3 px-4 rounded-xl shadow-md text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 disabled:opacity-50 transition-all"
      >
        {{ isLoading() ? 'Registrando...' : 'Registrarse' }}
      </button>

      <p class="text-center text-sm text-gray-600">
        ¿Ya tienes cuenta?
        <a routerLink="/auth/login" class="font-medium text-brand-600 hover:text-brand-500">Inicia sesión</a>
      </p>
    </form>
  </div>
</div>
