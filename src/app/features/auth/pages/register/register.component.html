<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
    
    <div class="text-center">
      <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Crear Cuenta</h2>
      <p class="mt-2 text-sm text-gray-500">Registra tus datos para solicitar ayuda</p>
    </div>

    <div *ngIf="errorMessage()" class="p-4 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm flex items-center gap-2">
      <span>{{ errorMessage() }}</span>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="mt-8 space-y-6">
      <div class="space-y-4">
        <div>
          <label for="fullName" class="block text-sm font-medium text-gray-700">Nombre Completo</label>
          <input 
            id="fullName" 
            type="text" 
            formControlName="fullName" 
            placeholder="Juan Pérez"
            [ngClass]="{'border-red-500 focus:ring-red-500': isFieldInvalid('fullName')}"
            class="mt-1 block w-full px-4 py-3 rounded-xl border border-gray-300 shadow-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm transition-colors outline-none"
          />
          <p *ngIf="isFieldInvalid('fullName')" class="mt-1 text-xs text-red-500">El nombre debe tener al menos 3 caracteres.</p>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
          <input 
            id="email" 
            type="email" 
            formControlName="email" 
            placeholder="correo@empresa.com"
            [ngClass]="{'border-red-500 focus:ring-red-500': isFieldInvalid('email')}"
            class="mt-1 block w-full px-4 py-3 rounded-xl border border-gray-300 shadow-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm transition-colors outline-none"
          />
          <p *ngIf="isFieldInvalid('email')" class="mt-1 text-xs text-red-500">Ingrese un correo válido.</p>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
          <input 
            id="password" 
            type="password" 
            formControlName="password" 
            placeholder="••••••••"
            [ngClass]="{'border-red-500 focus:ring-red-500': isFieldInvalid('password')}"
            class="mt-1 block w-full px-4 py-3 rounded-xl border border-gray-300 shadow-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm transition-colors outline-none"
          />
          <p *ngIf="isFieldInvalid('password')" class="mt-1 text-xs text-red-500">La contraseña requiere al menos 6 caracteres.</p>
        </div>
      </div>

      <div>
        <button 
          type="submit" 
          [disabled]="isLoading()"
          class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 disabled:opacity-50 transition-all"
        >
          <span *ngIf="!isLoading()">Registrarse</span>
          <span *ngIf="isLoading()">Registrando...</span>
        </button>
      </div>

      <div class="text-center">
        <p class="text-sm text-gray-600">
          ¿Ya tienes una cuenta?
          <a routerLink="/auth/login" class="font-medium text-brand-600 hover:text-brand-500">Inicia sesión</a>
        </p>
      </div>
    </form>
  </div>
</div>
