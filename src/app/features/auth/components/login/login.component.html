<div class="auth-container">
  <div class="auth-card">
    <h2>Iniciar Sesión</h2>
    <p class="subtitle">Mesa de Ayuda - HelpDesk</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      @if (errorMessage()) {
        <div class="alert alert-danger">
          {{ errorMessage() }}
        </div>
      }

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="correo@ejemplo.com"
          [class.is-invalid]="isFieldInvalid('email')"
        />
        @if (isFieldInvalid('email')) {
          <span class="error-text">Ingrese un correo válido</span>
        }
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="••••••••"
          [class.is-invalid]="isFieldInvalid('password')"
        />
        @if (isFieldInvalid('password')) {
          <span class="error-text">La contraseña debe tener al menos 6 caracteres</span>
        }
      </div>

      <button type="submit" [disabled]="isLoading()" class="btn btn-primary">
        @if (isLoading()) {
          Procesando...
        } @else {
          Ingresar
        }
      </button>
    </form>

    <div class="auth-footer">
      <p>¿No tienes una cuenta? <a routerLink="/auth/register">Regístrate aquí</a></p>
    </div>
  </div>
</div>
