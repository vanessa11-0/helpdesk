<div class="modal-backdrop">
  <div class="modal-card">
    <header class="modal-header">
      <h2>Nueva Solicitud de Soporte</h2>
      <button class="btn-close" (click)="onCancel()">✕</button>
    </header>

    @if (errorMessage()) {
      <div class="alert alert-danger">{{ errorMessage() }}</div>
    }

    <form [formGroup]="ticketForm" (ngSubmit)="onSubmit()" class="modal-form">
      <div class="form-group">
        <label for="title">Asunto / Título *</label>
        <input id="title" type="text" formControlName="title" placeholder="Ej: Error al procesar pago" />
      </div>

      <div class="form-group">
        <label for="priority">Prioridad *</label>
        <select id="priority" formControlName="priority">
          <option value="Baja">Baja</option>
          <option value="Media">Media</option>
          <option value="Alta">Alta</option>
          <option value="Urgente">Urgente</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Descripción Detallada *</label>
        <textarea id="description" rows="4" formControlName="description" placeholder="Describe el problema o duda..."></textarea>
      </div>

      <footer class="modal-actions">
        <button type="button" class="btn btn-outline" (click)="onCancel()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Enviando...' : 'Crear Ticket' }}
        </button>
      </footer>
    </form>
  </div>
</div>
