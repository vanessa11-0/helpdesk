<div class="max-w-2xl">
  <div class="mb-6">
    <a routerLink="/tickets" class="text-sm text-brand-600 hover:text-brand-700">&larr; Volver al listado</a>
    <h1 class="mt-2 text-2xl font-bold text-gray-900">Nuevo ticket</h1>
    <p class="text-sm text-gray-500 mt-1">Describe el problema con el mayor detalle posible.</p>
  </div>

  <div *ngIf="errorMessage()" class="mb-5 p-4 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm">
    {{ errorMessage() }}
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm space-y-5">
    <div>
      <label for="title" class="block text-sm font-medium text-gray-700">Título</label>
      <input
        id="title"
        type="text"
        formControlName="title"
        placeholder="La impresora del piso 3 no responde"
        [ngClass]="{ 'border-red-500': isInvalid('title') }"
        class="mt-1 block w-full px-4 py-3 rounded-xl border border-gray-300 shadow-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm outline-none"
      />
      <p *ngIf="isInvalid('title')" class="mt-1 text-xs text-red-500">El título debe tener al menos 5 caracteres.</p>
    </div>

    <div>
      <label for="priority" class="block text-sm font-medium text-gray-700">Prioridad</label>
      <select
        id="priority"
        formControlName="priority"
        class="mt-1 block w-full px-4 py-3 rounded-xl border border-gray-300 shadow-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm outline-none bg-white"
      >
        <option *ngFor="let p of priorities" [value]="p">{{ p | priorityLabel }}</option>
      </select>
    </div>

    <div>
      <label for="description" class="block text-sm font-medium text-gray-700">Descripción</label>
      <textarea
        id="description"
        rows="6"
        formControlName="description"
        placeholder="¿Qué ocurre, desde cuándo y qué has intentado?"
        [ngClass]="{ 'border-red-500': isInvalid('description') }"
        class="mt-1 block w-full px-4 py-3 rounded-xl border border-gray-300 shadow-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm outline-none resize-y"
      ></textarea>
      <p *ngIf="isInvalid('description')" class="mt-1 text-xs text-red-500">La descripción debe tener al menos 10 caracteres.</p>
    </div>

    <div class="flex items-center gap-3 pt-2">
      <button
        type="submit"
        [disabled]="isSubmitting()"
        class="px-5 py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold shadow-sm disabled:opacity-50 transition-colors"
      >
        {{ isSubmitting() ? 'Creando...' : 'Crear ticket' }}
      </button>
      <a routerLink="/tickets" class="px-5 py-3 rounded-xl border border-gray-300 text-gray-600 text-sm font-medium hover:bg-gray-50">
        Cancelar
      </a>
    </div>
  </form>
</div>
