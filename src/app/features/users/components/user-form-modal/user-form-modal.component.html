<div class="modal-backdrop">
  <div class="modal-card">
    <header class="modal-header">
      <h2>{{ userToEdit ? 'Editar Usuario' : 'Crear Nuevo Usuario' }}</h2>
      <button class="btn-close" (click)="onCancel()">✕</button>
    </header>

    @if (errorMessage()) {
      <div class="alert alert-danger">{{ errorMessage() }}</div>
    }

    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="modal-form">
      <div class="form-group">
        <label for="name">Nombre Completo *</label>
        <input id="name" type="text" formControlName="name" placeholder="Ej: Ana María Gómez" />
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico *</label>
        <input id="email" type="email" formControlName="email" placeholder="correo@ejemplo.com" />
      </div>

      <div class="form-group">
        <label for="role">Rol Asignado *</label>
        <select id="role" formControlName="role">
          <option value="Cliente">Cliente</option>
          <option value="Agente">Agente</option>
          <option value="Administrador">Administrador</option>
        </select>
      </div>

      @if (!userToEdit) {
        <div class="form-group">
          <label for="password">Contraseña Temporal *</label>
          <input id="password" type="password" formControlName="password" placeholder="Mínimo 6 caracteres" />
        </div>
      }

      <footer class="modal-actions">
        <button type="button" class="btn btn-outline" (click)="onCancel()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Guardando...' : (userToEdit ? 'Actualizar' : 'Crear Usuario') }}
        </button>
      </footer>
    </form>
  </div>
</div>
