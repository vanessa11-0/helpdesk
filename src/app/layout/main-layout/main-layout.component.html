<div class="app-shell">
  <!-- Navegación Lateral (Sidebar) -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">S</div>
      <span class="brand-name">SupportDesk</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📊</span>
        <span>Dashboard</span>
      </a>

      <a routerLink="/tickets" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🎫</span>
        <span>Solicitudes</span>
      </a>

      @if (currentUser?.role === 'Administrador') {
        <a routerLink="/users" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">👥</span>
          <span>Usuarios</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">{{ currentUser?.name?.charAt(0) || 'U' }}</div>
        <div class="user-details">
          <span class="user-name">{{ currentUser?.name }}</span>
          <span class="user-role">{{ currentUser?.role }}</span>
        </div>
      </div>
      <button (click)="logout()" class="btn-logout" title="Cerrar Sesión">
        🚪
      </button>
    </div>
  </aside>

  <!-- Contenido Principal -->
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-search">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Buscar rápidamente..." />
      </div>
      <div class="topbar-actions">
        <span class="status-indicator"></span>
        <span class="status-text">En línea</span>
      </div>
    </header>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
