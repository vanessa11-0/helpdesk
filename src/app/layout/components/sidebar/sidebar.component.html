<aside class="w-64 bg-white border-r border-gray-100 flex flex-col min-h-screen">
  <div class="p-6">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center text-white font-bold text-base shadow-sm">
        HD
      </div>
      <span class="font-bold text-gray-900 tracking-tight text-lg">HelpDesk</span>
    </div>
  </div>

  <nav class="flex-1 px-4 space-y-1">
    <a
      *ngFor="let item of menuItems()"
      [routerLink]="item.route"
      routerLinkActive="bg-brand-50 text-brand-700 font-semibold"
      [routerLinkActiveOptions]="{ exact: item.exact }"
      class="block px-4 py-3 text-sm text-gray-600 rounded-xl hover:bg-gray-50 hover:text-gray-900 transition-colors"
    >
      {{ item.label }}
    </a>
  </nav>
</aside>
