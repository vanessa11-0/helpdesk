<header class="h-16 bg-white border-b border-gray-100 px-6 flex items-center justify-between sticky top-0 z-20">
  <div class="flex items-center gap-3">
    <h1 class="text-lg font-semibold text-gray-800">Mesa de Ayuda</h1>
  </div>

  <div class="flex items-center gap-4" *ngIf="authService.currentUser() as user">
    <!-- Rol Badge -->
    <span [class]="getRoleBadgeClass(user.role)" class="px-2.5 py-1 text-xs font-semibold rounded-full border">
      {{ user.role }}
    </span>

    <!-- Perfil del usuario -->
    <div class="flex items-center gap-3 border-l border-gray-100 pl-4">
      <div class="w-9 h-9 rounded-full bg-brand-500 text-white flex items-center justify-center font-bold text-sm shadow-sm">
        {{ user.fullName.charAt(0).toUpperCase() }}
      </div>
      <div class="hidden md:block text-left">
        <p class="text-sm font-medium text-gray-900 leading-tight">{{ user.fullName }}</p>
        <p class="text-xs text-gray-400">{{ user.email }}</p>
      </div>
    </div>

    <!-- Botón Cerrar Sesión -->
    <button 
      (click)="onLogout()" 
      title="Cerrar sesión"
      class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-xl transition-colors"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
    </button>
  </div>
</header>
