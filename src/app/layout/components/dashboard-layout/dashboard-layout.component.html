<div class="flex min-h-screen bg-gray-50">
  <app-sidebar class="hidden lg:block shrink-0"></app-sidebar>

  <div class="flex-1 flex flex-col min-w-0">
    <app-navbar></app-navbar>

    <!-- Navegación para pantallas donde el sidebar está oculto -->
    <nav class="lg:hidden bg-white border-b border-gray-100 px-4 py-2 flex gap-2 overflow-x-auto">
      <a
        *ngFor="let item of menuItems()"
        [routerLink]="item.route"
        routerLinkActive="bg-brand-50 text-brand-700 font-semibold"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        class="whitespace-nowrap px-3 py-1.5 text-sm text-gray-600 rounded-lg hover:bg-gray-50"
      >
        {{ item.label }}
      </a>
    </nav>

    <main class="flex-1 p-4 md:p-8 max-w-7xl w-full mx-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
