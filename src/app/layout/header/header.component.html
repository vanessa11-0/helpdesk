<header class="app-header">
  <div class="brand">
    <span class="logo">🎫 HelpDesk</span>
  </div>
  <div class="user-info">
    @if (currentUser()) {
      <span class="user-name">{{ currentUser()?.name }}</span>
      <span class="badge-role">{{ currentUser()?.role }}</span>
      <button (click)="onLogout()" class="btn-logout">Cerrar Sesión</button>
    }
  </div>
</header>
